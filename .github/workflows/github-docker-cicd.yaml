name: CI/CD - Colins

env:
  DOCKER_USER: ${{ secrets.DOCKER_USER }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  REPO_NAME: ${{ secrets.REPO_NAME }}

on:
  push:
    branches: [ "main" ]
    paths: [ "pipeline-main/**", ".github/workflows/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "pipeline-main/**", ".github/workflows/**" ]

# Toutes les commandes s'exécutent dans pipeline-main/
defaults:
  run:
    working-directory: pipeline-main

jobs:
  ci_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Format
        run: |
          if [ -f app.py ]; then black app.py; else echo "app.py not found, skipping black"; fi

      - name: Lint
        run: |
          if [ -f app.py ]; then pylint --disable=R,C app.py; else echo "app.py not found, skipping pylint"; fi

      - name: Test
        run: |
          if [ -f test.py ]; then pytest -vv test.py;
          elif ls -d tests* >/dev/null 2>&1; then pytest -q;
          else echo "No tests found, skipping pytest"; fi

  cd_pipeline:
    runs-on: ubuntu-latest
    needs: [ ci_pipeline ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Compute tag
        id: vars
        run: echo "TAG=$(date +'%Y-%m-%d--%H-%M-%S')" >> $GITHUB_OUTPUT

      # Build dans le dossier courant (pipeline-main via defaults.run)
      - name: Build image (timestamp tag)
        run: docker build . -f Dockerfile -t $DOCKER_USER/$REPO_NAME:${{ steps.vars.outputs.TAG }}

      - name: Tag latest
        run: docker tag $DOCKER_USER/$REPO_NAME:${{ steps.vars.outputs.TAG }} $DOCKER_USER/$REPO_NAME:latest

      - name: Push both tags
        run: |
          docker push $DOCKER_USER/$REPO_NAME:${{ steps.vars.outputs.TAG }}
          docker push $DOCKER_USER/$REPO_NAME:latest
