# 


name: Github-Docker Hub MLOps pipeline - colins

env:
  DOCKER_USER: ${{ secrets.DOCKER_USER }}          # Nom d'utilisateur Docker Hub stocké en secret GitHub
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}  # Mot de passe Docker Hub stocké en secret GitHub
  REPO_NAME: ${{ secrets.REPO_NAME }}              # Nom du dépôt Docker à utiliser (ex : monrepo/mlops)

on:
  push:
    branches:
      - main              # Déclenche le pipeline à chaque push sur la branche main
  pull_request:
    branches:
      - main              # Déclenche le pipeline à chaque pull request vers main

jobs:

  ci_pipeline: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0    # Clone tout l’historique Git (utile pour certains outils)

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: 3.9    # Configure Python version 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Installe les dépendances si requirements.txt existe

      - name: Format code with black
        run: black app.py
        # Formatte le fichier app.py selon le standard black

      - name: Lint code with pylint
        run: pylint --disable=R,C app.py
        # Analyse le code app.py avec pylint en désactivant certains avertissements

      - name: Run tests
        run: python -m pytest -vv test.py
        # Lance les tests unitaires avec pytest (niveau verbeux)

  cd_pipeline:
    runs-on: ubuntu-latest
    needs: ci_pipeline    # Ce job s’exécute seulement si ci_pipeline réussit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin
        # Connexion sécurisée à Docker Hub via mot de passe stocké dans un secret

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d--%H-%M-%S')" >> $GITHUB_OUTPUT
        # Génère un tag d’image Docker avec la date et l’heure courante

      - name: Build Docker image
        run: docker build . --file Dockerfile --tag $DOCKER_USER/$REPO_NAME:${{ steps.date.outputs.date }}
        # Construit l’image Docker et la tag avec le tag basé sur la date

      - name: Push Docker image
        run: docker push $DOCKER_USER/$REPO_NAME:${{ steps.date.outputs.date }}
        # Pousse l’image Docker sur Docker Hub
